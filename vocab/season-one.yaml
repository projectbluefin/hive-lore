# Season of the Blueberries — title-slide subtitle candidates
#
# Three reviewed, copyeditable subtitle candidates per chapter. The publisher
# chapter title stays verbatim as the headline; downstream picks ONE candidate
# per chapter and freezes it. See AGENTS.md for the contract.
#
# Selection is a pure function of chapter number (tools/titles.py). Nothing
# here is random, clocked, or networked.

schema: hive-lore/season-one/v1
season: season-of-the-blueberries
authorised_by: "Owner, 2026-08-29: custom/generated lore belongs only on episode title slides; contributor nameplates are factual GitHub data and get no generated title."
policy:
  generated_scope: title_slide_subtitle_only
  headlines: publisher_verbatim
  candidates_per_chapter: 3
  frozen_downstream: true

# Provenance for the chapter list itself. The 12 headlines are the publisher's
# chapter titles, recorded verbatim from the video's chapter metadata; the
# captured artifact is the authority the `chapters` list below is validated
# against (tests/test_titles.py reads it — never a hand-typed copy).
headline_source:
  kind: publisher_chapter_metadata
  video: "https://www.youtube.com/watch?v=jlzQnXcUxqI"
  artifact: sources/jlzQnXcUxqI.chapters.json
  captured_with: "yt-dlp --dump-single-json --skip-download <url> | python3 tools/capture_chapters.py --from-json -"
  recorded: "2026-08-29"

# Owner-authored project lore (AGENTS.md, "Owner-authored project lore").
# Project lore, NOT Destiny canon: it may not be cited as canon and may not
# inform canon* candidates. Wording is verbatim — reproduce exactly or omit.
# Kept off the heroes: never person-facing, never on a nameplate or dossier.
project_lore:
  - id: savathuns-ship
    subject: "Savathûn's ship, named from this project's point of view"
    lines:
      - "Palace of AI Expectations"
      - "Tomb of Platform Teams"
    source: "Witch Queen archive, 01:53, bottom-right lower third"
    nature: owner_authored
    copy_source: owner_authored_lore
    person_facing: never
    placement: film renderer only; this repository supplies provenance/data

# Banned in subtitle text: person-facing claims and terms that read as
# biography, affiliation, or a named character's personal epithet. This list
# is a floor, not a ceiling (AGENTS.md).
banned_terms:
  # Named characters and their personal titles — nobody's slide borrows them.
  - Oryx
  - Taken King
  - Witch Queen
  - God-King
  - Xivu Arath
  - Rhulk
  - Mara Sov
  # Cannon-fodder / degrading castes (carried over from the revoked epithet
  # policy — still never aimed at anything on screen).
  - Thrall
  # Person-facing machinery — a subtitle is never about a person.
  - "@"
  - GitHub
  - contributor
  - maintainer

